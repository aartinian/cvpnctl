version: 2

builds:
  - id: cvpnctl
    main: ./cmd/cvpnctl
    binary: cvpnctl
    env:
      # Disable CGO for cross-compilation
      - CGO_ENABLED=0
    # easyrsa is a POSIX shell script, so Windows is not supported.
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version=v{{ .Version }}

archives:
  - ids: [cvpnctl]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

# Extra files to include in the release artifacts
release:
  extra_files:
    - glob: ./scripts/install.sh
    - glob: ./cvpnctl.yaml.example
    - glob: ./base.ovpn.example
