version: 2

builds:
  - id: cvpnctl
    main: ./cmd/cvpnctl
    binary: cvpnctl
    env:
      # Disable CGO for cross-compilation
      - CGO_ENABLED=0
    # easyrsa is a POSIX shell script, so Windows is not supported.
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version=v{{ .Version }}

archives:
  - ids: [cvpnctl]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

# Extra files to include in the release artifacts
release:
  extra_files:
    - glob: ./scripts/install.sh
    - glob: ./cvpnctl.yaml.example
    - glob: ./base.ovpn.example

# brew install aartinian/tap/cvpnctl (macOS only)
homebrew_casks:
  - name: cvpnctl
    binaries: [cvpnctl]
    homepage: https://github.com/aartinian/cvpnctl
    description: Manage AWS Client VPN user certificates with EasyRSA
    repository:
      owner: aartinian
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    dependencies:
      - formula: easy-rsa
    hooks:
      post:
        # Remove the quarantine attribute so macOS allows execution
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/cvpnctl"]
          end
    caveats: |
      EasyRSA came with it: set easyrsa.path in cvpnctl.yaml to the output of
        echo "$(brew --prefix)/bin"
      Getting started: https://github.com/aartinian/cvpnctl#quick-start
